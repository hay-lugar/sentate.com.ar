<h2>Recuperá tu contraseña de Sentate</h2>
<p>Recibimos un pedido para cambiar tu contraseña. Si fuiste vos, abrí este enlace para elegir una nueva:</p>
<p><a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery&next=/recuperar/nueva">Elegir una contraseña nueva</a></p>
<p>El enlace vence y solo sirve una vez. Si no pediste este cambio, ignorá este email: tu contraseña no cambia.</p>
